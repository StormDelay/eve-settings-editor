name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          # 24: `node --test` strips the TypeScript itself, so the frontend
          # tests need no test framework and no extra dependency.
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Typecheck frontend
        working-directory: app
        run: npm run check
      - name: Test frontend
        working-directory: app
        run: npm test
      - name: Build frontend (generate_context embeds build/)
        working-directory: app
        run: npm run build
      - name: Lint workspace (warnings are failures)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
        # The corpus gates run here against the committed synthetic corpus in
        # fixtures/ (see fixtures/README.md). The real corpus is local-only by
        # design (spec §8) — testdata/ is personal data and stays gitignored, so
        # the byte-identity gate is a golden-file check on CI and an independence
        # proof only on a machine that has testdata/ checked out.
