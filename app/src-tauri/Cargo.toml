[package]
name = "app"
version = "0.42.0"
edition = "2021"

[lib]
# `_lib`: a lib named like the bin collides on Windows (rust-lang/cargo#8519).
# rlib only — staticlib/cdylib are the Tauri template's mobile targets.
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Reads the clipboard through Rust. `navigator.clipboard.readText` works in
# WebView2 but raises a permission prompt on every app launch, which is the
# wrong thing to show on a Paste button.
tauri-plugin-clipboard-manager = "2"
settings-model = { path = "../../crates/settings-model" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
blue-marshal = { path = "../../crates/blue-marshal" }
# Scene files (`scenes.rs`). Already this workspace's YAML reader — it is what
# settings-model's probe_pack.rs parses exchange formats with.
yaml-rust2 = "0.10"
# MCP server (`--mcp`, mcp.rs): a second adapter over `ops`, beside the Tauri
# commands. Hand-written schemas, so rmcp's macros and schemars are unused.
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "time", "io-std", "io-util", "net", "macros"] }
# What Tauri's `data_dir()` calls, so the MCP process resolves the same app dir
# without a Tauri handle (lib.rs `app_dir_base`).
dirs = "6"
# layout_render (mcp_render.rs): a PNG of the window layout as an MCP image
# block. Both crates are already in the lockfile through Tauri's icon handling.
png = "0.18"
base64 = "0.22"
# The overview width preview measures and draws text with the same engine EVE
# does (FreeType, auto-hinted), from EVE's own font files — client_env.rs.
# `bundled` compiles FreeType 2.13.2 with `cc`: no cmake, no system library,
# and the same version on every platform, which is what makes it exact.
# Pinned: 0.38's bundled build pulls in libpng + zlib and fails on Windows.
freetype-rs = { version = "=0.37.0", features = ["bundled"] }

